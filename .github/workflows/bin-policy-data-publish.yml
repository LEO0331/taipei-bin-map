name: Prepare reviewed bin policy data bundle
on:
  workflow_dispatch:
    inputs:
      approval_file:
        description: 'Committed reviewed approval JSON path (see governance document)'
        required: true
        type: string
      raw_directory:
        description: 'Optional committed approved raw snapshot directory; empty downloads exact approved hashes'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: bin-policy-data-publication
  cancel-in-progress: false
jobs:
  prepare-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: bin-policy-data-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify approval is committed and prepare isolated review bundle
        env:
          APPROVAL_FILE: ${{ inputs.approval_file }}
          RAW_DIRECTORY: ${{ inputs.raw_directory }}
        run: |
          git ls-files --error-unmatch -- "$APPROVAL_FILE"
          if [ -n "$RAW_DIRECTORY" ]; then
            git ls-files --error-unmatch -- "$RAW_DIRECTORY/sources.json"
            npx tsx scripts/prepareBinPolicyPublication.ts "$APPROVAL_FILE" test-results/publication-review "$RAW_DIRECTORY"
          else
            npx tsx scripts/prepareBinPolicyPublication.ts "$APPROVAL_FILE" test-results/publication-review
          fi
      - name: Materialize reviewed candidate in the ephemeral runner
        run: |
          npx tsx scripts/stageBinPolicyPublication.ts test-results/publication-review
          npx tsx scripts/reconcileBinSources.ts
          npx tsx scripts/buildBinPolicyImpactReport.ts
          npx tsx scripts/buildBinPolicyHealth.ts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2 --output=test-results/publication-e2e
      - name: Package validated candidate for owner review
        run: |
          git add --intent-to-add -- public/data/bin-policy data/raw/bin-policy data/reports/bin-policy
          git -c core.whitespace=cr-at-eol diff --check -- public/data/bin-policy data/reports/bin-policy
          git diff --binary --full-index -- public/data/bin-policy data/raw/bin-policy data/reports/bin-policy > test-results/publication-review/candidate.patch
          git rev-parse HEAD > test-results/publication-review/base-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-policy-publication-review
          path: test-results/publication-review
          if-no-files-found: error
